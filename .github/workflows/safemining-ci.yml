name: SafeMining CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: safemining-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.10f1
  PROJECT_PATH: .

jobs:
  validate:
    name: Lint & LOTO checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Workspace hygiene
        run: python tools/ci/validate_workspace.py

      - name: LOTO objective matrix
        run: python tools/ci/validate_loto_objectives.py

      - name: C# sanity (brace balance)
        run: python tools/ci/validate_csharp_sanity.py

  security-surface:
    name: Security surface scan
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Security static scan (changed backend paths)
        run: python tools/ci/validate_security_surface.py --changed-only

  unity-compile:
    name: Unity compile (batchmode)
    runs-on: ubuntu-latest
    needs: validate
    if: vars.CI_UNITY_ENABLED == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Unity activation
        uses: game-ci/unity-activate@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Unity compile gate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          customParameters: -batchmode -nographics -quit -executeMethod SafeMiningCiCompile.ValidateProjectCompiles
